services:
  zm.rideservice.api:
    image: ${DOCKER_REGISTRY-}zmrideserviceapi
    build:
      context: .
      dockerfile: ZM.RideService.Api/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://0.0.0.0:5000
    ports:
      - "5000:5000"
      - "5001:5001"
    networks:
      - proxybackend

  zm.driverservice.api:
    image: ${DOCKER_REGISTRY-}zmdriverserviceapi
    build:
      context: .
      dockerfile: ZM.DriverService.Api/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://0.0.0.0:5100
    ports:
      - "5100:5100"
      - "5101:5101"
    networks:
      - proxybackend

  zm.matchingservice.api:
    image: ${DOCKER_REGISTRY-}zmmatchingserviceapi
    build:
      context: .
      dockerfile: ZM.MatchingService.Api/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://0.0.0.0:5200
    ports:
      - "5200:5200"
      - "5201:5201"
    networks:
      - proxybackend

  zm.paymentservice.api:
    image: ${DOCKER_REGISTRY-}zmpaymentserviceapi
    build:
      context: .
      dockerfile: ZM.PaymentService.Api/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://0.0.0.0:5300
    ports:
      - "5300:5300"
      - "5301:5301"
    networks:
      - proxybackend

  zm.notificationservice.api:
    image: ${DOCKER_REGISTRY-}zmnotificationserviceapi
    build:
      context: .
      dockerfile: ZM.NotificationService.Api/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://0.0.0.0:5400
    ports:
      - "5400:5400"
      - "5401:5401"
    networks:
      - proxybackend

  mqbroker:
    image: rabbitmq:3-management
    container_name: MQueue
    hostname: distributedsys-mq
    environment:
      - RABBITMQ_DEFAULT_USER=admin
      - RABBITMQ_DEFAULT_PASS=admin
    ports:
     - "15672:15672"
     - "5672:5672"
    volumes:
      - mqvolume:/var/lib/rabbitmq
    networks: 
      - proxybackend

  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redisvolume:/data
    networks: 
      - proxybackend

  redisinsight:
    image: redis/redisinsight:latest
    container_name: redisinsight
    ports:
      - "5540:5540"
    networks:
      - proxybackend
    depends_on:
      - redis
    volumes:
      - redisinsightvolume:/data

networks:
  proxybackend:
    name: proxybackend
    driver: bridge

volumes:
  mqvolume:
  redisvolume:
  redisinsightvolume:
